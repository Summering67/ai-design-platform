server:
  address: ":8081"
  read_timeout: 5s
  write_timeout: 75s
  idle_timeout: 60s
  shutdown_timeout: 10s

database:
  dsn: ""
  max_open_conns: 20
  max_idle_conns: 10
  conn_max_lifetime: 30m
  ping_timeout: 3s

log:
  environment: development
  level: info

ai:
  model: deepseek-v4-flash
  # 0 表示不限制模型请求时长。
  request_timeout: 0s

agent:
  # 0 表示不限制无活动等待和整次运行时长。
  node_timeout: 0s
  total_timeout: 0s
  max_input_bytes: 524288
  max_output_bytes: 1048576
  max_pages: 20
  max_nodes: 500
  max_depth: 32
  max_tasks: 12
  max_task_depth: 4
  max_concurrency: 4
  max_retries: 1

auth:
  fixed_user_password: ""
