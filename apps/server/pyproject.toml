[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ai-design-server"
version = "0.1.0"
description = "FastAPI parity backend for the AI Design Platform"
requires-python = ">=3.13,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "langchain-openai>=0.3,<1",
  "langgraph>=0.6,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.8,<3",
  "PyYAML>=6.0,<7",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "build>=1.2,<2",
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
  "types-jsonschema>=4.25",
  "types-PyYAML>=6.0"
]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_design_server"]

[tool.hatch.build.targets.wheel.force-include]
"../../packages/design-contract/schema/v2/design-document.schema.json" = "ai_design_server/design/design-document.schema.json"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
lint.ignore = ["B008", "BLE001"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
